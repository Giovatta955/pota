# Netlify: Next.js rilevato in automatico (runtime OpenNext di Netlify).
[build]
  command = "npm run build"
  publish = ".next"
  # Risparmio crediti (ogni pubblicazione in produzione costa 15 crediti su 300/mese):
  # si pubblica SOLO se l'ultimo commit contiene "[deploy]". Gli altri push non consumano nulla.
  ignore = "! git log -1 --pretty=%B | grep -q '\\[deploy\\]'"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Valori PUBBLICI (finiscono comunque nel browser): stanno qui per non dipendere dal pannello.
  # I SEGRETI (SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) vanno SOLO nel pannello Netlify.
  NEXT_PUBLIC_SUPABASE_URL = "https://kyjcoscljfrqeiittagh.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_gTS0do9EtREJQnBuXY9JwA_fEKD3JeH"
  NEXT_PUBLIC_SITE_URL = "https://studiokore.netlify.app"

# Runtime Next.js di Netlify (SSR, server actions, proxy). Dichiarato esplicitamente perché
# il progetto è stato creato da un branch senza Next.js e il rilevamento automatico non l'ha attivato.
[[plugins]]
  package = "@netlify/plugin-nextjs"
