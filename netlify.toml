# Netlify: Next.js rilevato in automatico (runtime OpenNext di Netlify).
[build]
  command = "npm run build"
  publish = ".next"
  # Risparmio crediti (ogni pubblicazione in produzione costa 15 crediti su 300/mese):
  # si pubblica SOLO se l'ultimo commit contiene "[deploy]". Gli altri push non consumano nulla.
  ignore = "! git log -1 --pretty=%B | grep -q '\\[deploy\\]'"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Runtime Next.js di Netlify (SSR, server actions, proxy). Dichiarato esplicitamente perché
# il progetto è stato creato da un branch senza Next.js e il rilevamento automatico non l'ha attivato.
[[plugins]]
  package = "@netlify/plugin-nextjs"
