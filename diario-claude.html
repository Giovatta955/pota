<title>Diario dei sintomi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F6; --surface:#FFFFFF; --ink:#1B2A38; --ink2:#53636F; --rule:#D9E1E6; --grid:#E9EEF0;
  --accent:#2F5AA8; --accent-ink:#FFFFFF; --crash:#B3261E; --ok:#2E7D5B; --nodata:#E3E8EB;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10161B; --surface:#172028; --ink:#E5ECF1; --ink2:#9AABB9; --rule:#2A3641; --grid:#16202A;
    --accent:#86A8EA; --accent-ink:#0D1620; --crash:#F2776C; --ok:#62C391; --nodata:#24303A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10161B; --surface:#172028; --ink:#E5ECF1; --ink2:#9AABB9; --rule:#2A3641; --grid:#16202A;
  --accent:#86A8EA; --accent-ink:#0D1620; --crash:#F2776C; --ok:#62C391; --nodata:#24303A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--font); color:var(--ink); background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  font-size:17px; line-height:1.45;
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--paper)}
button,input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule)}
.top-in{max-width:640px; margin:0 auto; padding-block:12px 10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.title{font-size:15px; color:var(--ink2); margin:0}
.datebar{display:flex; align-items:center; gap:8px; margin-top:2px}
.datebar h1{font-size:24px; margin:0; flex:1; line-height:1.15}
.iconbtn{width:44px; height:44px; border-radius:22px; border:1px solid var(--rule); background:var(--surface); font-size:22px; line-height:1; display:grid; place-items:center; cursor:pointer}
.iconbtn:disabled{opacity:.35; cursor:default}
.status{font-size:14px; color:var(--ink2); min-height:20px}
.status.warn{color:var(--crash); font-weight:700}
.status.ok::before{content:"● "; color:var(--ok)}
.status.busy::before{content:"● "; color:var(--ink2)}
.btn.armed{background:var(--crash); color:#fff; border-color:var(--crash); font-weight:700}

main{max-width:640px; margin:0 auto; padding-block:8px 24px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
section.view{display:none}
section.view.on{display:block}

.block{background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:16px; margin:14px 0}
.block h2{font-size:19px; margin:0 0 4px}
.hint{font-size:15px; color:var(--ink2); margin:0 0 12px}

.scale{margin:14px 0 4px}
.scale-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.scale-label{font-weight:700}
.scale-val{font-size:15px; color:var(--ink2); font-variant-numeric:tabular-nums}
.scale-row{display:grid; grid-template-columns:repeat(11,1fr); gap:3px; margin-top:6px}
.scale-row button{height:40px; border:1px solid var(--rule); background:var(--paper); border-radius:8px; font-variant-numeric:tabular-nums; font-size:15px; cursor:pointer; padding:0}
.scale-row button[aria-pressed="true"]{color:#fff; border-color:transparent; font-weight:700}
.scale-ends{display:flex; justify-content:space-between; font-size:13px; color:var(--ink2); margin-top:3px}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--rule); background:var(--paper); border-radius:20px; padding:9px 14px; font-size:15px; cursor:pointer; min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{flex:1 1 auto; min-height:44px; border:1px solid var(--rule); background:var(--paper); border-radius:10px; padding:8px 10px; font-size:15px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}

.stepper{display:flex; align-items:center; gap:10px; margin:10px 0}
.stepper .lbl{flex:1}
.stepper output{min-width:46px; text-align:center; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums}

.field{display:block; margin:12px 0 4px; font-weight:700}
input[type=text], input[type=date], textarea{width:100%; border:1px solid var(--rule); border-radius:10px; background:var(--paper); padding:11px 12px; font-size:16px}
textarea{min-height:80px; resize:vertical}

.crashbar{border-radius:14px; padding:14px 16px; margin:14px 0; background:var(--surface); border:2px solid var(--crash)}
.crashbar p{margin:0 0 10px}
.btn{min-height:46px; border-radius:12px; padding:10px 16px; border:1px solid var(--rule); background:var(--surface); cursor:pointer; font-size:16px}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
.btn.danger{background:var(--crash); color:#fff; border-color:var(--crash); font-weight:700}
.btn.wide{width:100%}
.row{display:flex; gap:8px; flex-wrap:wrap}

.list{list-style:none; margin:0; padding:0}
.list li{border-top:1px solid var(--rule); padding:12px 0}
.list li:first-child{border-top:0}
.crash-title{font-weight:700}
.meta{font-size:15px; color:var(--ink2)}
.tag{display:inline-block; font-size:13px; padding:2px 8px; border-radius:10px; background:var(--crash); color:#fff; margin-left:6px; vertical-align:2px}

.pa{display:grid; gap:8px}
.pa-row{border-top:1px solid var(--rule); padding-top:12px; margin-top:4px}
.pa-row:first-child{border-top:0; padding-top:0}
.pa-row input{margin-top:6px}
.pa-del{background:none; border:0; color:var(--crash); padding:6px 0; cursor:pointer; font-size:15px}

.strip-wrap{overflow-x:auto; padding-bottom:4px}
.strip{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 16px); gap:3px; width:max-content}
.cell{width:16px; height:16px; border-radius:4px; background:var(--nodata)}
.cell.crash{box-shadow: inset 0 0 0 2px var(--crash)}
.cell.blank{background:transparent}
.legend{display:flex; flex-wrap:wrap; gap:12px; font-size:13px; color:var(--ink2); margin-top:10px; align-items:center}
.legend i{display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:5px}

.stats{display:grid; grid-template-columns:1fr auto; gap:0; margin:0}
.stats dt,.stats dd{padding:10px 0; border-top:1px solid var(--rule); margin:0}
.stats dt:first-of-type,.stats dd:first-of-type{border-top:0}
.stats dd{font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
.bars{list-style:none; padding:0; margin:0}
.bars li{display:grid; grid-template-columns:1fr 44px; gap:8px; align-items:center; padding:6px 0}
.bar{height:8px; border-radius:4px; background:var(--accent); margin-top:4px}

.tabs{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom, 0px)}
.tabs-in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:62px; text-decoration:none; color:var(--ink2); font-size:14px}
.tabs a svg{width:24px; height:24px}
.tabs a[aria-current="page"]{color:var(--accent); font-weight:700}

.empty{color:var(--ink2); font-size:15px; margin:4px 0}
.slot-table{border-collapse:separate; border-spacing:4px; width:100%; font-variant-numeric:tabular-nums}
.slot-table th{font-size:14px; color:var(--ink2); font-weight:700; text-align:center; padding:4px}
.slot-table tbody th{text-align:left; color:var(--ink)}
.slot-table td{text-align:center; padding:10px 4px; border-radius:8px; background:var(--nodata); font-weight:700}
@media (prefers-reduced-motion: no-preference){
  .saved-flash{animation:fl 1.2s ease}
  @keyframes fl{from{opacity:.3} to{opacity:1}}
}
</style>

<script>
(function(){
"use strict";

/* ---------- costanti ---------- */
const SCALES = [
  {k:"fatica",   label:"Stanchezza",               lo:"nessuna",   hi:"non mi alzo"},
  {k:"dolore",   label:"Dolore",                   lo:"nessuno",   hi:"insopportabile"},
  {k:"gambe",    label:"Gambe pesanti e tese",     lo:"normali",   hi:"come se scoppiassero"},
  {k:"rls",      label:"Bisogno di muovere le gambe la sera", lo:"no", hi:"non riesco a stare fermo"},
  {k:"giramenti",label:"Giramenti di testa",       lo:"nessuno",   hi:"devo sedermi"},
  {k:"nebbia",   label:"Nebbia mentale",           lo:"lucido",    hi:"non riesco a pensare"}
];
const ZONES = ["Gambe","Piedi","Ginocchia","Glutei","Schiena","Collo e spalle","Braccia","Mani","Testa","Tutto il corpo"];
const LIMITS = [
  "Stare in piedi più di 5 minuti","Camminare a lungo","Fare le scale","Guidare","Fare la spesa",
  "Cucinare","Pulire casa","Lavarmi o vestirmi senza fatica","Lavorare tutta la giornata",
  "Concentrarmi","Uscire con altri","Uno sforzo fisico leggero"
];
const WORK = ["Non lavorativo","Lavorato","Lavorato a fatica","Uscito prima","Assente"];
const CRASH_SYMPTOMS = ["Gambe che cedono","Gambe che scoppiano","Dolore muscolare","Stanchezza estrema","Giramenti","Nebbia mentale","Sonno peggiore","Tremore"];
const CRASH_DELAY = ["Subito","Dopo qualche ora","Il giorno dopo","Dopo 2 o più giorni"];
const SLOTS = [{k:"mattino",t:"Mattino"},{k:"pomeriggio",t:"Pomeriggio"},{k:"sera",t:"Sera"}];
const SLOT_SCALES = SCALES.filter(x=>x.k!=="rls");
const RLS = SCALES.find(x=>x.k==="rls");
function defaultSlot(){ const hr=new Date().getHours(); return hr<12?"mattino":hr<18?"pomeriggio":"sera"; }
const PA_SUGGEST = ["Stare in piedi","Camminare","Scale","Sforzo fisico e palestra","Lavoro","Faccende di casa","Spesa","Guidare","Vita sociale","Sonno"];

/* ---------- stato ---------- */
const S = {
  mode:null, col:null, uid:null,
  days:{}, crashes:{}, profile:{rows:[]},
  date: iso(new Date()), tab:"oggi", period:30,
  crashForm:null, loadedOnce:false, slot:null
};
const pending = {}, inflight = {}, timers = {}, dirty = new Set();

/* ---------- utilità date ---------- */
function iso(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${dd}`; }
function parse(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function today(){ return iso(new Date()); }
function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
const fmtLong = new Intl.DateTimeFormat("it-IT",{weekday:"long", day:"numeric", month:"long"});
const fmtShort = new Intl.DateTimeFormat("it-IT",{day:"numeric", month:"short", year:"numeric"});
function longLabel(s){ const t=fmtLong.format(parse(s)); return t.charAt(0).toUpperCase()+t.slice(1); }
function shortLabel(s){ return fmtShort.format(parse(s)); }

/* ---------- colore scala 0-10 ---------- */
function scaleColor(v){
  // verde -> ambra -> rosso
  const h = v<=5 ? 145 - (v/5)*105 : 40 - ((v-5)/5)*36;
  const dark = document.documentElement.getAttribute("data-theme")==="dark" ||
    (document.documentElement.getAttribute("data-theme")!=="light" && matchMedia("(prefers-color-scheme: dark)").matches);
  return `hsl(${h} ${dark?55:60}% ${dark?48:42}%)`;
}

/* ---------- DOM helper ---------- */
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==="class") el.className=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="text") el.textContent=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
const $ = id => document.getElementById(id);
function armed(btn){
  if(btn.classList.contains("armed")) return true;
  const t=btn.textContent; btn.classList.add("armed"); btn.textContent="Tocca di nuovo per confermare";
  setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove("armed"); btn.textContent=t; } }, 3000);
  return false;
}
function setStatus(t, warn, kind){ const s=$("status"); s.textContent=t||""; s.classList.toggle("warn", !!warn); s.classList.toggle("ok", kind==="ok"); s.classList.toggle("busy", kind==="busy"); }

/* ---------- persistenza ---------- */
const LS_KEY="diario-sintomi-v2";
function localLoad(){
  try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return; const o=JSON.parse(raw);
    S.days=o.days||{}; S.crashes=o.crashes||{}; S.profile=o.profile||{rows:[]};
  }catch(e){}
}
function localSave(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({days:S.days, crashes:S.crashes, profile:S.profile})); return true; }
  catch(e){ return false; }
}
function clock(){ return new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit",second:"2-digit"}); }
function docId(kind, key){ return kind==="day" ? "d"+key : kind==="crash" ? "c"+key : "profile"; }

const getters = {};
function typingNow(){ const a=document.activeElement; return a && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && a.type==="text")); }
function scheduleSave(id, getData){
  dirty.add(id);
  getters[id]=getData;
  // 1) copia sul dispositivo: subito, a ogni tocco e a ogni lettera
  const okLocal=localSave();
  if(S.mode!=="db"){
    dirty.delete(id);
    if(okLocal){ const data=getData(); if(id.startsWith("d")) bozzeClean(id.slice(1), data); setStatus("Salvato alle "+clock()+" · solo su questo dispositivo", false, "ok"); }
    else setStatus("Salvataggio non riuscito su questo dispositivo: scarica i dati dal Riepilogo", true);
    return;
  }
  // 2) online: subito per i tocchi, raggruppando la digitazione veloce
  clearTimeout(timers[id]);
  setStatus("Salvataggio…", false, "busy");
  const wait = typingNow() ? 300 : 0;
  timers[id]=setTimeout(()=>{ timers[id]=null; pending[id]=getData(); flush(id); }, wait);
}
// salva subito tutto quello che è in attesa (uscita dall'app, cambio pagina, fine scrittura)
function flushAll(){
  for(const id of Object.keys(timers)){
    if(timers[id]){ clearTimeout(timers[id]); timers[id]=null; pending[id]=getters[id](); flush(id); }
  }
}
function savedNow(){ if(Object.values(timers).some(Boolean) || Object.values(inflight).some(Boolean)) return; setStatus("Salvato alle "+clock(), false, "ok"); }
/* bozze locali: rete di sicurezza per il testo scritto */
const BOZZA="bozza:";
function bozzaSet(date, field, val){ try{ localStorage.setItem(BOZZA+date+":"+field, JSON.stringify({v:val, t:Date.now()})); }catch(e){} }
function bozzaGet(date, field){ try{ const r=localStorage.getItem(BOZZA+date+":"+field); return r? JSON.parse(r) : null; }catch(e){ return null; } }
function bozzeClean(date, saved){
  try{
    for(let i=localStorage.length-1;i>=0;i--){
      const k=localStorage.key(i); if(!k || !k.startsWith(BOZZA+date+":")) continue;
      const field=k.slice((BOZZA+date+":").length);
      const b=JSON.parse(localStorage.getItem(k));
      if(b && (saved[field]||"")===b.v) localStorage.removeItem(k);
    }
  }catch(e){}
}
async function flush(id){
  if(S.mode!=="db"){ delete pending[id]; dirty.delete(id); return; }
  if(inflight[id]) return;
  while(pending[id]){
    const data=pending[id]; pending[id]=null; inflight[id]=true;
    try{
      await S.col.doc(id).set(data);
      inflight[id]=false;
      if(!pending[id] && !timers[id]) dirty.delete(id);
      if(id.startsWith("d")) bozzeClean(id.slice(1), data);
      savedNow();
    }
    catch(e){
      if(e && e.code==="quota_exceeded") setStatus("Spazio esaurito: non posso salvare altre giornate", true);
      else if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r, 800+Math.random()*800)); pending[id]=pending[id]||data; }
      else { pending[id]=pending[id]||data; setStatus("Salvataggio online non riuscito: i dati sono al sicuro su questo dispositivo. Riprovo alla prossima modifica.", true); inflight[id]=false; return; }
    }
    inflight[id]=false;
  }
}
async function removeDoc(id){
  localSave();
  if(S.mode!=="db"){ setStatus("Eliminato", false, "ok"); return; }
  try{ await S.col.doc(id).delete(); setStatus("Eliminato"); }catch(e){ setStatus("Eliminazione non riuscita", true); }
}

function applySnapshot(snap){
  for(const d of snap.docs){
    const id=d.id;
    if(!/^(d\d{4}-\d{2}-\d{2}|c.+|profile)$/.test(id)) continue;
    if(dirty.has(id) || inflight[id] || pending[id]) continue;
    const v=d.data(); if(!v) continue;
    if(id.startsWith("d")){
      // aggiorna lo stesso oggetto, così i campi aperti non scrivono su una copia vecchia
      const k=id.slice(1); const cur=S.days[k];
      if(cur){ for(const key of Object.keys(cur)) delete cur[key]; Object.assign(cur, structuredClone(v)); }
      else S.days[k]=structuredClone(v);
    }
    else if(id.startsWith("c")) S.crashes[id.slice(1)]=structuredClone(v);
    else if(id==="profile") S.profile=structuredClone(v);
  }
  // rimozioni
  const ids=new Set(snap.docs.map(d=>d.id));
  if(!snap.metadata.fromCache) for(const k of Object.keys(S.crashes)) if(!ids.has("c"+k) && !dirty.has("c"+k) && !inflight["c"+k]) delete S.crashes[k];
}

function uploadLocal(){
  for(const k of Object.keys(S.days)) if(isRecorded(S.days[k])) touchDay(k);
  for(const k of Object.keys(S.crashes)) saveCrash(k);
  if(S.profile.rows && S.profile.rows.length) saveProfile();
}
async function connect(){
  localLoad(); renderAll();
  let user=null, db=null;
  try{ [user, db] = await Promise.all([window.claude?.use?.("user"), window.claude?.use?.("db")]); }catch(e){}
  if(db && user){
    const uid = await user.id();
    if(uid){
      S.mode="db"; S.uid=uid; S.col=db.collection("data/users/"+uid);
      const t=setTimeout(()=>{ if(!S.loadedOnce) setStatus("Non riesco a raggiungere i dati salvati. Controlla la connessione.", true); }, 10000);
      S.col.onSnapshot(snap=>{
        if(!snap.metadata.fromCache && !S.loadedOnce){
          const ours=snap.docs.filter(d=>/^(d\d{4}-\d{2}-\d{2}|c.+|profile)$/.test(d.id));
          if(!ours.length) uploadLocal();
        }
        applySnapshot(snap);
        localSave();
        if(!snap.metadata.fromCache){ clearTimeout(t); if(!S.loadedOnce){ S.loadedOnce=true; setStatus("Salvataggio automatico attivo · i dati sono sincronizzati", false, "ok"); } }
        renderAll(true);
      }, err=>{ clearTimeout(t); setStatus("Collegamento ai dati interrotto. Le modifiche di adesso potrebbero non salvarsi.", true); });
      return;
    }
  }
  S.mode="local";
  setStatus("Salvataggio online non disponibile qui: i dati restano su questo dispositivo", true);
  renderAll();
}

/* ---------- giornata ---------- */
function day(date){ return S.days[date] || (S.days[date]={type:"day", date}); }
function touchDay(date){
  const id=docId("day", date);
  scheduleSave(id, ()=>Object.assign({}, S.days[date], {updatedAt:new Date().toISOString()}));
}

function scaleComp(target, sc, onChange, key){
  const val=target[sc.k];
  const lid="l-"+key+"-"+sc.k;
  const wrap=h("div",{class:"scale"});
  const valTxt=h("span",{class:"scale-val", text: val==null?"non segnato":`${val} su 10`});
  wrap.append(h("div",{class:"scale-head"}, h("span",{class:"scale-label", id:lid, text:sc.label}), valTxt));
  const row=h("div",{class:"scale-row", role:"group", "aria-labelledby":lid});
  for(let i=0;i<=10;i++){
    const on = val===i;
    const b=h("button",{type:"button", "aria-pressed":String(on), "aria-label":`${sc.label}: ${i}`, text:String(i)});
    if(on) b.style.background=scaleColor(i);
    b.addEventListener("click",()=>{ target[sc.k] = target[sc.k]===i ? null : i; onChange(); });
    row.append(b);
  }
  wrap.append(row, h("div",{class:"scale-ends"}, h("span",{text:"0 "+sc.lo}), h("span",{text:"10 "+sc.hi})));
  return wrap;
}
function chipsComp(date, field, options){
  const d=day(date); const sel=new Set(d[field]||[]);
  const box=h("div",{class:"chips"});
  for(const o of options){
    box.append(h("button",{type:"button", class:"chip", "aria-pressed":String(sel.has(o)), text:o, onclick:()=>{
      sel.has(o)?sel.delete(o):sel.add(o); d[field]=[...sel]; touchDay(date); renderOggi();
    }}));
  }
  return box;
}
function segComp(current, options, onPick, labelledBy){
  const box=h("div",{class:"seg", role:"group", "aria-labelledby":labelledBy});
  for(const o of options){
    const v = typeof o==="object"? o.v : o, t = typeof o==="object"? o.t : o;
    box.append(h("button",{type:"button", "aria-pressed":String(current===v), text:t, onclick:()=>onPick(current===v?null:v)}));
  }
  return box;
}
function stepper(label, value, step, min, max, onChange, fmt){
  const out=h("output",{text: fmt?fmt(value):String(value)});
  return h("div",{class:"stepper"},
    h("span",{class:"lbl", text:label}),
    h("button",{type:"button", class:"iconbtn", "aria-label":"Meno "+label, onclick:()=>onChange(Math.max(min, +(value-step).toFixed(1)))}, "−"),
    out,
    h("button",{type:"button", class:"iconbtn", "aria-label":"Più "+label, onclick:()=>onChange(Math.min(max, +(value+step).toFixed(1)))}, "+")
  );
}
function textField(date, field, label, multi){
  const d=day(date);
  const id="f-"+field;
  const input = multi ? h("textarea",{id}) : h("input",{type:"text", id});
  // se c'è una bozza non ancora salvata (app chiusa di colpo), la recupera
  const b=bozzaGet(date, field);
  if(b && b.v!==(d[field]||"") && b.t > Date.parse(d.updatedAt||0)){ d[field]=b.v; touchDay(date); }
  input.value = d[field]||"";
  input.addEventListener("input",()=>{ day(date)[field]=input.value; bozzaSet(date, field, input.value); touchDay(date); });
  input.addEventListener("blur", flushAll);
  return [h("label",{class:"field", for:id, text:label}), input];
}

function openCrashOn(date){
  for(const [k,c] of Object.entries(S.crashes)){
    const end=c.end||today();

}

function saveCrash(k){
  const id=docId("crash", k);
  scheduleSave(id, ()=>Object.assign({}, S.crashes[k], {updatedAt:new Date().toISOString()}));
}
function renderCrolli(){
  const v=$("v-crolli"); v.replaceChildren();
  const f=S.crashForm;
  if(f){
    const form=h("div",{class:"block"}, h("h2",{text: f.key?"Modifica crollo":"Nuovo crollo"}));
    const start=h("input",{type:"date", id:"c-start", max:today()}); start.value=f.start||today();
    const trig=h("input",{type:"text", id:"c-trig", placeholder:"Es. 2 serie di kickback, 9 ore in piedi"}); trig.value=f.trigger||"";
    const end=h("input",{type:"date", id:"c-end", max:today()}); end.value=f.end||"";
    const note=h("textarea",{id:"c-note"}); note.value=f.note||"";
    const sel=new Set(f.sintomi||[]);
    let delay=f.ritardo??null, inten=f.intensita??null;
    const commit=()=>{
      if(!start.value) return;
      if(end.value && end.value<start.value){ setStatus("La fine non può essere prima dell’inizio", true); return; }
      if(!f.key) f.key=start.value.replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,7);
      S.crashes[f.key]={type:"crash", start:start.value, end:end.value||null, trigger:trig.value.trim(), ritardo:delay, sintomi:[...sel], intensita:inten, note:note.value.trim()};
      Object.assign(f, S.crashes[f.key]);
      saveCrash(f.key);
    };
    [start,end].forEach(el=>el.addEventListener("change", commit));
    [trig,note].forEach(el=>{ el.addEventListener("input", commit); el.addEventListener("blur", flushAll); });
    const chips=h("div",{class:"chips"}); 
    for(const o of CRASH_SYMPTOMS) chips.append(h("button",{type:"button", class:"chip", "aria-pressed":String(sel.has(o)), text:o, onclick:(e)=>{ sel.has(o)?sel.delete(o):sel.add(o); e.currentTarget.setAttribute("aria-pressed", String(sel.has(o))); commit(); }}));
    const delayBox=h("div",{class:"seg", role:"group", "aria-labelledby":"c-delay"});
    const paintDelay=()=>{ delayBox.replaceChildren(...CRASH_DELAY.map(o=>h("button",{type:"button","aria-pressed":String(delay===o), text:o, onclick:()=>{ delay = delay===o?null:o; paintDelay(); commit(); }}))); };
    paintDelay();
    const intRow=h("div",{class:"scale-row", role:"group", "aria-labelledby":"c-int"});
    const paintInt=()=>{ intRow.replaceChildren(...Array.from({length:11},(_,i)=>{ const b=h("button",{type:"button","aria-pressed":String(inten===i), text:String(i), onclick:()=>{ inten = inten===i?null:i; paintInt(); commit(); }}); if(inten===i) b.style.background=scaleColor(i); return b; })); };
    paintInt();
    if(!f.key) setTimeout(commit, 0); // il crollo esiste da subito, con la data di inizio
    form.append(
      h("p",{class:"hint", text:"Si salva da solo mentre lo compili."}),
      h("label",{class:"field", for:"c-start", text:"Inizio"}), start,
      h("label",{class:"field", for:"c-trig", text:"Cosa l’ha scatenato"}), trig,
      h("p",{class:"field", id:"c-delay", text:"Quanto tempo dopo lo sforzo è arrivato"}), delayBox,
      h("p",{class:"field", text:"Sintomi"}), chips,
      h("p",{class:"field", id:"c-int", text:"Quanto è stato forte (0-10)"}), intRow,
      h("label",{class:"field", for:"c-end", text:"Fine (lascia vuoto se è ancora in corso)"}), end,
      h("label",{class:"field", for:"c-note", text:"Note"}), note,
      h("div",{class:"row", style:"margin-top:16px"},
        h("button",{type:"button", class:"btn primary", text:"Fatto", onclick:()=>{
          commit(); flushAll(); S.crashForm=null; renderCrolli();
        }}),
        h("button",{type:"button", class:"btn", style:"color:var(--crash)", text:"Elimina", onclick:(e)=>{
          if(!f.key){ S.crashForm=null; renderCrolli(); return; }
          if(!armed(e.currentTarget)) return;
          clearTimeout(timers[docId("crash", f.key)]); timers[docId("crash", f.key)]=null; dirty.delete(docId("crash", f.key));
          delete S.crashes[f.key]; removeDoc(docId("crash", f.key)); S.crashForm=null; renderCrolli();
        }})
      )
    );
    v.append(form);
    return;
  }
  v.append(h("div",{class:"block"},
    h("h2",{text:"Crolli dopo sforzo"}),
    h("p",{class:"hint", text:"Ogni crollo con causa, ritardo e durata. Per la commissione è il dato più forte."}),
    h("button",{type:"button", class:"btn danger wide", text:"Registra un crollo", onclick:()=>{ S.crashForm={start:today()}; renderCrolli(); }})
  ));
  const list=Object.entries(S.crashes).sort((a,b)=>b[1].start.localeCompare(a[1].start));
  const box=h("div",{class:"block"});
  if(!list.length){ box.append(h("p",{class:"empty", text:"Nessun crollo registrato. Quando ne arriva uno, segnalo qui o dalla pagina Oggi."})); }
  else{
    const ul=h("ul",{class:"list"});
    for(const [k,c] of list){
      const end=c.end||today(); const n=daysBetween(c.start,end)+1;
      ul.append(h("li",null,
        h("div",{class:"crash-title"}, `${shortLabel(c.start)} · ${n} ${n===1?"giorno":"giorni"}`, !c.end?h("span",{class:"tag", text:"in corso"}):null),
        c.trigger? h("div",{class:"meta", text:"Causa: "+c.trigger}):null,
        c.ritardo? h("div",{class:"meta", text:"Arrivato: "+c.ritardo.toLowerCase()}):null,
        c.sintomi&&c.sintomi.length? h("div",{class:"meta", text:c.sintomi.join(", ")}):null,
        h("button",{type:"button", class:"btn", style:"margin-top:8px", text:"Modifica", onclick:()=>{ S.crashForm=Object.assign({key:k}, c); renderCrolli(); window.scrollTo(0,0); }})
      ));
    }
    box.append(ul);
  }
  v.append(box);
}

/* ---------- riepilogo ---------- */
function vals(d,k){
  if(d.slots){ const a=SLOTS.map(s=>d.slots[s.k]&&d.slots[s.k][k]).filter(n=>typeof n==="number"); if(a.length) return a; }
  return typeof d[k]==="number" ? [d[k]] : [];
}
function dayMean(d,k){ const a=vals(d,k); return a.length? a.reduce((x,y)=>x+y,0)/a.length : null; }
function dayMax(d,k){ const a=vals(d,k); return a.length? Math.max(...a) : null; }
const SCORE_KEYS=["fatica","dolore","gambe","giramenti","nebbia"];
function dayScore(d){
  const m=SCORE_KEYS.map(k=>dayMean(d,k)).filter(x=>x!=null);
  return m.length? m.reduce((a,b)=>a+b,0)/m.length : null;
}
function isRecorded(d){ return d && Object.keys(d).some(k=>!["type","date","updatedAt","slots"].includes(k) && d[k]!=null && d[k]!=="" && !(Array.isArray(d[k])&&!d[k].length)) || (d && d.slots && SLOTS.some(s=>d.slots[s.k] && Object.keys(d.slots[s.k]).some(k=>k!=="ora" && typeof d.slots[s.k][k]==="number"))); }
function crashDaySet(){
  const set=new Set();
  for(const c of Object.values(S.crashes)){
    const end=c.end||today(); let d=c.start; let guard=0;
    while(d<=end && guard<400){ set.add(d); d=addDays(d,1); guard++; }
  }
  return set;
}
function periodDates(){
  const end=today();
  let start;
  if(S.period==="tutto"){
    const all=[...Object.keys(S.days), ...Object.values(S.crashes).map(c=>c.start)].sort();
    start = all[0] || end;
  } else start=addDays(end, -(S.period-1));
  const out=[]; let d=start, g=0; while(d<=end && g<1200){ out.push(d); d=addDays(d,1); g++; }
  return out;
}
function avg(arr){ return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function fmt1(x){ return x==null? "–" : x.toLocaleString("it-IT",{maximumFractionDigits:1}); }

function computeStats(){
  const dates=periodDates(); const cset=crashDaySet();
  const rec=dates.map(d=>S.days[d]).filter(isRecorded);
  const meanOf=k=>avg(rec.map(d=>dayMean(d,k)).filter(x=>x!=null));
  const num=k=>rec.map(d=>d[k]).filter(x=>typeof x==="number");
  const grave=rec.filter(d=>["fatica","dolore","gambe"].some(k=>{ const m=dayMax(d,k); return m!=null && m>=7; })).length;
  const crashes=Object.values(S.crashes).filter(c=>(c.end||today())>=dates[0] && c.start<=dates[dates.length-1]);
  const crashDays=dates.filter(d=>cset.has(d)).length;
  const durations=crashes.map(c=>daysBetween(c.start, c.end||today())+1);
  const work=w=>rec.filter(d=>d.lavoro===w).length;
  const limCount={};
  rec.forEach(d=>(d.limiti||[]).forEach(l=>limCount[l]=(limCount[l]||0)+1));
  const slotAvg={};
  for(const s of SLOTS){
    slotAvg[s.k]={};
    for(const k of ["fatica","dolore","gambe","giramenti"]){
      slotAvg[s.k][k]=avg(rec.map(d=>d.slots&&d.slots[s.k]&&d.slots[s.k][k]).filter(x=>typeof x==="number"));
    }
  }
  const hasSlots=SLOTS.some(s=>Object.values(slotAvg[s.k]).some(x=>x!=null));
  const esempi=rec.filter(d=>(d.voluto&&d.voluto.trim())||(d.limitiAltro&&d.limitiAltro.trim())||(d.limiti&&d.limiti.length)).slice(-10).reverse();
  return {
    dates, cset, rec, nRec:rec.length,
    fatica:meanOf("fatica"), dolore:meanOf("dolore"), gambe:meanOf("gambe"), giramenti:meanOf("giramenti"),
    sonno:avg(num("sonnoOre")), ristoro:avg(num("ristoro")),
    grave, crashes, crashDays, durMedia:avg(durations),
    assenze:work("Assente"), uscito:work("Uscito prima"), fatica_lav:work("Lavorato a fatica"),
    cedGiorni:rec.filter(d=>(d.cedimenti||0)>0).length, cedTot:rec.reduce((a,d)=>a+(d.cedimenti||0),0),
    aiuto:rec.filter(d=>d.aiuto===true).length,
    lim:Object.entries(limCount).sort((a,b)=>b[1]-a[1]),
    slotAvg, hasSlots, esempi
  };
}

function renderRiepilogo(){
  const v=$("v-riepilogo"); v.replaceChildren();
  const st=computeStats();

  v.append(h("div",{class:"block"}, h("h2",{id:"h-per", text:"Periodo"}),
    segComp(S.period, [{v:30,t:"30 giorni"},{v:90,t:"90 giorni"},{v:"tutto",t:"Tutto"}], val=>{ S.period=val??30; renderRiepilogo(); }, "h-per")));

  const sb=h("div",{class:"block"}, h("h2",{text:"Giorno per giorno"}),
    h("p",{class:"hint", text:"Ogni quadrato è un giorno, una colonna per settimana. Bordo rosso: giorni di crollo."}));
  const wrap=h("div",{class:"strip-wrap"}); const strip=h("div",{class:"strip", role:"img", "aria-label":`Calendario di ${st.dates.length} giorni`});
  const first=parse(st.dates[0]); const lead=(first.getDay()+6)%7;
  for(let i=0;i<lead;i++) strip.append(h("div",{class:"cell blank"}));
  for(const d of st.dates){
    const dd=S.days[d]; const sc=dd?dayScore(dd):null;
    const c=h("div",{class:"cell"+(st.cset.has(d)?" crash":""), title:`${shortLabel(d)}${sc!=null?": "+fmt1(sc)+" su 10":": nessun dato"}${st.cset.has(d)?" · crollo":""}`});
    if(sc!=null) c.style.background=scaleColor(Math.round(sc));
    strip.append(c);
  }
  wrap.append(strip); sb.append(wrap);
  sb.append(h("div",{class:"legend"},
    h("span",null,h("i",{style:`background:${scaleColor(1)}`}),"giornata leggera"),
    h("span",null,h("i",{style:`background:${scaleColor(5)}`}),"media"),
    h("span",null,h("i",{style:`background:${scaleColor(9)}`}),"pesante"),
    h("span",null,h("i",{style:"background:var(--nodata)"}),"non segnata"),
    h("span",null,h("i",{style:"background:transparent; box-shadow:inset 0 0 0 2px var(--crash)"}),"crollo")
  ));
  v.append(sb);

  if(st.hasSlots){
    const tb=h("table",{class:"slot-table"},
      h("thead",null,h("tr",null,h("th",{text:""}),h("th",{text:"Stanch."}),h("th",{text:"Dolore"}),h("th",{text:"Gambe"}),h("th",{text:"Giram."}))),
      h("tbody",null, ...SLOTS.map(s=>h("tr",null, h("th",{scope:"row", text:s.t}),
        ...["fatica","dolore","gambe","giramenti"].map(k=>{ const x=st.slotAvg[s.k][k]; const td=h("td",{text:fmt1(x)}); if(x!=null){ td.style.background=scaleColor(Math.round(x)); td.style.color="#fff"; } return td; })
      )))
    );
    v.append(h("div",{class:"block"}, h("h2",{text:"Momenti della giornata"}), h("p",{class:"hint", text:"Media su 10 per mattino, pomeriggio e sera."}), h("div",{class:"strip-wrap"}, tb)));
  }

  const dl=h("dl",{class:"stats"});
  const add=(t,val)=>dl.append(h("dt",{text:t}), h("dd",{text:val}));
  add("Giornate segnate", `${st.nRec} su ${st.dates.length}`);
  add("Stanchezza media", st.fatica==null?"–":`${fmt1(st.fatica)} su 10`);
  add("Dolore medio", st.dolore==null?"–":`${fmt1(st.dolore)} su 10`);
  add("Gambe pesanti, media", st.gambe==null?"–":`${fmt1(st.gambe)} su 10`);
  add("Giornate gravi (7 o più)", String(st.grave));
  add("Crolli", String(st.crashes.length));
  add("Giorni passati in crollo", String(st.crashDays));
  add("Durata media di un crollo", st.durMedia==null?"–":`${fmt1(st.durMedia)} giorni`);
  add("Giorni di lavoro persi", String(st.assenze));
  add("Uscito prima dal lavoro", String(st.uscito));
  add("Giorni con gambe che cedono", `${st.cedGiorni} (${st.cedTot} volte)`);
  add("Giorni con aiuto da altri", String(st.aiuto));
  add("Sonno medio", st.sonno==null?"–":`${fmt1(st.sonno)} ore, riposo ${fmt1(st.ristoro)} su 10`);
  v.append(h("div",{class:"block"}, h("h2",{text:"In numeri"}), dl));

  const lb=h("div",{class:"block"}, h("h2",{text:"Cosa non sei riuscito a fare"}));
  if(!st.lim.length) lb.append(h("p",{class:"empty", text:"Nessuna limitazione segnata nel periodo."}));
  else{
    const max=st.lim[0][1]; const ul=h("ul",{class:"bars"});
    for(const [l,n] of st.lim.slice(0,8)) ul.append(h("li",null, h("div",null, h("div",{text:l}), h("div",{class:"bar", style:`width:${Math.max(6,n/max*100)}%`})), h("strong",{text:`${n} gg`})));
    lb.append(ul);
  }
  v.append(lb);

  if(st.esempi.length){
    const ul=h("ul",{class:"list"});
    for(const d of st.esempi){
      ul.append(h("li",null,
        h("div",{class:"crash-title", text:shortLabel(d.date)}),
        d.voluto&&d.voluto.trim()? h("div",{class:"meta", text:"Avrei voluto: "+d.voluto.trim()}):null,
        (d.limiti&&d.limiti.length)||(d.limitiAltro&&d.limitiAltro.trim()) ? h("div",{class:"meta", text:"Non sono riuscito: "+[...(d.limiti||[]), (d.limitiAltro||"").trim()].filter(Boolean).join("; ")}) : null
      ));
    }
    v.append(h("div",{class:"block"}, h("h2",{text:"Dal diario"}), h("p",{class:"hint", text:"Le ultime giornate con cose che avresti voluto fare e non hai potuto."}), ul));
  }

  v.append(h("div",{class:"block"}, h("h2",{text:"Per la commissione"}),
    h("p",{class:"hint", text:"Scarica il riepilogo da stampare o i dati completi. Per un PDF impaginato, chiedilo a Claude in chat."}),
    h("div",{class:"row"},
      h("button",{type:"button", class:"btn primary", text:"Scarica riepilogo", onclick:()=>download("riepilogo-diario.md", buildSummary(st))}),
      h("button",{type:"button", class:"btn", text:"Scarica dati (CSV)", onclick:()=>download("diario-sintomi.csv", buildCSV())})
    )));
}

function csvCell(x){ if(x==null) return ""; if(typeof x==="number") x=Math.round(x*10)/10; const s=Array.isArray(x)? x.join("; ") : String(x); return /[";\n,]/.test(s)? `"${s.replace(/"/g,'""')}"` : s; }
function buildCSV(){
  const sk=["fatica","dolore","gambe","giramenti","nebbia"];
  const cols=["data","stanchezza_media","dolore_medio","gambe_media","giramenti_media","nebbia_media"];
  for(const s of SLOTS){ for(const k of sk) cols.push(`${s.k}_${k}`); cols.push(`${s.k}_ora`); }
  cols.push("gambe_sera","sonno_ore","sonno_riposo","cedimenti","zone_dolore","cosa_ho_fatto","avrei_voluto","non_riuscito","non_riuscito_altro","lavoro","aiuto","aiuto_note","duloxetina_mg","pregabalin_mg","paracetamolo","tachidol","effetti","note","crollo");
  const cset=crashDaySet();
  const lines=[cols.join(",")];
  for(const d of Object.keys(S.days).sort()){
    const x=S.days[d]; if(!isRecorded(x)) continue;
    const row=[d, ...sk.map(k=>dayMean(x,k))];
    for(const s of SLOTS){ const o=(x.slots&&x.slots[s.k])||{}; for(const k of sk) row.push(o[k]); row.push(o.ora); }
    const rls = x.slots&&x.slots.sera&&typeof x.slots.sera.rls==="number" ? x.slots.sera.rls : x.rls;
    row.push(rls,x.sonnoOre,x.ristoro,x.cedimenti,x.zone,x.fatto,x.voluto,x.limiti,x.limitiAltro,x.lavoro,x.aiuto==null?"":(x.aiuto?"sì":"no"),x.aiutoNote,x.duloxetina,x.pregabalin,x.paracetamolo,x.tachidol,x.effetti,x.note,cset.has(d)?"sì":"");
    lines.push(row.map(csvCell).join(","));
  }
  return lines.join("\n");
}
function buildSummary(st){
  const L=[];
  const p0=st.dates[0], p1=st.dates[st.dates.length-1];
  L.push(`# Diario dei sintomi`);
  L.push(`Periodo: ${shortLabel(p0)} – ${shortLabel(p1)} (${st.dates.length} giorni, ${st.nRec} giornate segnate)`,"");
  L.push(`## In numeri`);
  L.push(`- Stanchezza media: ${fmt1(st.fatica)} su 10`);
  L.push(`- Dolore medio: ${fmt1(st.dolore)} su 10`);
  L.push(`- Gambe pesanti e tese, media: ${fmt1(st.gambe)} su 10`);
  L.push(`- Giramenti di testa, media: ${fmt1(st.giramenti)} su 10`);
  L.push(`- Giornate gravi (stanchezza, dolore o gambe 7 o più): ${st.grave}`);
  L.push(`- Gambe che cedono in piedi: ${st.cedGiorni} giorni, ${st.cedTot} volte in totale`);
  L.push(`- Giorni di lavoro persi: ${st.assenze}; uscito prima: ${st.uscito}; lavorato a fatica: ${st.fatica_lav}`);
  L.push(`- Giorni con aiuto da altri: ${st.aiuto}`);
  L.push(`- Sonno medio: ${fmt1(st.sonno)} ore, riposo ${fmt1(st.ristoro)} su 10`,"");
  if(st.hasSlots){
    L.push(`## Momenti della giornata (media su 10)`);
    L.push(`| | Stanchezza | Dolore | Gambe | Giramenti |`, `| --- | --- | --- | --- | --- |`);
    for(const s of SLOTS){ const a=st.slotAvg[s.k]; L.push(`| ${s.t} | ${fmt1(a.fatica)} | ${fmt1(a.dolore)} | ${fmt1(a.gambe)} | ${fmt1(a.giramenti)} |`); }
    L.push("");
  }
  L.push(`## Crolli dopo sforzo`);
  if(!st.crashes.length) L.push(`Nessun crollo registrato nel periodo.`);
  else{
    L.push(`${st.crashes.length} crolli, ${st.crashDays} giorni complessivi, durata media ${fmt1(st.durMedia)} giorni.`,"");
    for(const c of [...st.crashes].sort((a,b)=>a.start.localeCompare(b.start))){
      const n=daysBetween(c.start,c.end||today())+1;
      L.push(`- ${shortLabel(c.start)}, ${n} ${n===1?"giorno":"giorni"}${c.end?"":" (in corso)"}${c.trigger?`, dopo: ${c.trigger}`:""}${c.ritardo?`, arrivato ${c.ritardo.toLowerCase()}`:""}${c.sintomi&&c.sintomi.length?`. Sintomi: ${c.sintomi.join(", ").toLowerCase()}`:""}`);
    }
  }
  L.push("");
  L.push(`## Cosa non sono riuscito a fare`);
  if(!st.lim.length) L.push(`Nessuna limitazione segnata.`);
  else st.lim.forEach(([l,n])=>L.push(`- ${l}: ${n} giorni`));
  L.push("");
  if(st.esempi.length){
    L.push(`## Dal diario`);
    for(const d of st.esempi){
      const parts=[];
      if(d.voluto&&d.voluto.trim()) parts.push(`avrei voluto: ${d.voluto.trim()}`);
      const nr=[...(d.limiti||[]), (d.limitiAltro||"").trim()].filter(Boolean);
      if(nr.length) parts.push(`non sono riuscito: ${nr.join("; ")}`);
      L.push(`- ${shortLabel(d.date)}: ${parts.join(". ")}`);
    }
    L.push("");
  }
  const rows=(S.profile.rows||[]).filter(r=>r.attivita||r.prima||r.adesso);
  if(rows.length){
    L.push(`## Prima e adesso`);
    L.push(`| Attività | Prima del 2023 | Adesso |`, `| --- | --- | --- |`);
    rows.forEach(r=>L.push(`| ${(r.attivita||"").replace(/\|/g,"/")} | ${(r.prima||"").replace(/\|/g,"/")} | ${(r.adesso||"").replace(/\|/g,"/")} |`));
    L.push("");
  }
  return L.join("\n");
}
async function download(name, text){
  let dl=null; try{ dl=await window.claude?.use?.("downloads"); }catch(e){}
  if(!dl){ setStatus("Il download non è disponibile in questa vista", true); return; }
  try{ await dl.save({filename:name, data:text}); setStatus("File pronto"); }
  catch(e){ if(e && e.code==="declined") setStatus("Download annullato"); else if(e && e.code==="rate_limited") setStatus("Attendi un momento e riprova"); else setStatus("Download non riuscito", true); }
}

/* ---------- navigazione ---------- */
const TABS=["oggi","crolli","limiti","riepilogo"];
function go(tab){ if(location.hash!=="#"+tab) location.hash=tab; else route(); }
function route(){
  const t=(location.hash||"#oggi").slice(1);
  S.tab=TABS.includes(t)?t:"oggi";
  for(const x of TABS){ $("v-"+x).classList.toggle("on", x===S.tab); }
  document.querySelectorAll(".tabs a").forEach(a=>{ if(a.dataset.tab===S.tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("datebar").style.display = S.tab==="oggi" ? "flex" : "none";
  $("topTitle").textContent = {oggi:"Diario dei sintomi", crolli:"Crolli", limiti:"Prima e adesso", riepilogo:"Riepilogo"}[S.tab];
  renderAll();
  window.scrollTo(0,0);
}
function renderDate(){
  $("dateLabel").textContent = S.date===today() ? "Oggi, "+longLabel(S.date).toLowerCase() : longLabel(S.date);
  $("nextDay").disabled = S.date>=today();
}
function renderAll(fromSnapshot){
  renderDate();
  const active=document.activeElement;
  const typing = active && (active.tagName==="INPUT"||active.tagName==="TEXTAREA");
  if(fromSnapshot && typing) return; // non interrompere chi sta scrivendo
  if(S.tab==="oggi") renderOggi();
  else if(S.tab==="crolli") renderCrolli();
  else if(S.tab==="limiti") renderLimiti();
  else renderRiepilogo();
}
S.slot=defaultSlot();
$("prevDay").addEventListener("click",()=>{ S.date=addDays(S.date,-1); S.slot="mattino"; renderAll(); });
$("nextDay").addEventListener("click",()=>{ if(S.date<today()){ S.date=addDays(S.date,1); S.slot = S.date===today()? defaultSlot() : "mattino"; renderAll(); } });
window.addEventListener("hashchange", ()=>{ flushAll(); route(); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushAll(); });
window.addEventListener("pagehide", flushAll);

route();
connect();
})();
</script>
