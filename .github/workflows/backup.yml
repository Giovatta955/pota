# Backup settimanale gratuito del database (il piano free di Supabase non ha backup giornalieri).
# Il dump è CIFRATO con una passphrase: resta illeggibile anche se il repo fosse pubblico.
# Segreti da creare in GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_DB_URL       connection string "Session pooler" (con la password del database)
#   BACKUP_PASSPHRASE     una frase lunga che conservi tu (senza, il backup non si apre)
name: Backup database
on:
  schedule:
    - cron: "23 2 * * 1" # lunedì 02:23 UTC
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla segreti
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", PASS: "${{ secrets.BACKUP_PASSPHRASE }}" }
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then echo "Segreti mancanti: backup saltato"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: Dump e cifratura
        if: env.SKIP != '1'
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", PASS: "${{ secrets.BACKUP_PASSPHRASE }}" }
        run: |
          docker run --rm -e DB postgres:17 sh -c 'pg_dump "$DB" --no-owner --no-privileges --schema=public --schema=auth --schema=storage' > dump.sql
          gzip dump.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "backup-$(date +%F).sql.gz.gpg" dump.sql.gz
          rm dump.sql.gz
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with:
          name: backup-db
          path: backup-*.sql.gz.gpg
          retention-days: 90
